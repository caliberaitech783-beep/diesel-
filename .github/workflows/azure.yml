name: Test and deploy Diesel

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          npm ci --omit=dev --prefix dist
          (cd dist && zip -qr ../diesel.zip .)
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: diesel
          path: diesel.zip

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency: diesel-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Azure configuration
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          DIESEL_HEALTH_ORIGIN: ${{ vars.DIESEL_HEALTH_ORIGIN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for name in AZURE_WEBAPP_NAME DIESEL_HEALTH_ORIGIN AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name in the repository's Actions settings"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/download-artifact@v4
        with:
          name: diesel
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: diesel.zip
      - name: Verify deployed commit and Diesel access
        env:
          DIESEL_HEALTH_ORIGIN: ${{ vars.DIESEL_HEALTH_ORIGIN }}
        run: |
          origin="${DIESEL_HEALTH_ORIGIN%/}"
          for attempt in {1..12}; do
            if curl --fail --silent --max-time 10 "$origin/healthz" |
              jq -e --arg commit "$GITHUB_SHA" '.status == "ok" and .commit == $commit and .masters == "ready" and .sharedMasters == "ready" and (.openingStock == "setup" or .openingStock == "ready")' >/dev/null; then
              if curl --silent --max-time 10 -o /dev/null -w '%{http_code} %{redirect_url}\n' "$origin/api/sign-in/start" |
                grep -Eq '^303 https://pulse\.cmll\.in/\?dieselSignIn=1&state=[A-Za-z0-9_-]{43}&code_challenge=[A-Za-z0-9_-]{43}$' &&
                [ "$(curl --silent --max-time 10 -o /dev/null -w '%{http_code}' "$origin/records?master=account-master")" = 303 ]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Diesel did not serve $GITHUB_SHA with master storage and sign-in available"
          exit 1
